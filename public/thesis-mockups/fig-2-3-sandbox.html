<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920" />
    <title>Рисунок 2.3 — Песочница (макет)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./thesis-mockups.css" />
    <style>
      .tm-sb-root {
        display: flex;
        flex-direction: column;
        gap: 14px;
        height: 100%;
      }
      .tm-sb-search input {
        width: 100%;
        height: 40px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 0 14px;
        font-family: inherit;
        font-size: 14px;
      }
      .tm-sb-row {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 16px;
        flex: 1;
        min-height: 0;
      }
      .tm-cat-btn {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 8px;
        padding: 10px 12px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: default;
      }
      .tm-cat-btn.tm-cat-active {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--table-row-hover);
      }
      .tm-work {
        position: relative;
        background: var(--map-canvas);
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
        min-height: 0;
      }
      .tm-chip-row {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        z-index: 1;
      }
      .tm-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
      }
      .tm-chip strong {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="tm-viewport">
      <header class="tm-header">
        <div class="tm-brand">
          <span class="tm-brand-mark">VSAT</span>
          <span class="tm-brand-name">diploma-z96a</span>
        </div>
        <nav class="tm-nav">
          <a href="#">Главная</a>
          <a href="#">О нас</a>
          <a href="#">Глобальная сеть</a>
          <a href="#" class="tm-active">Песочница</a>
          <a href="#">Предложения</a>
          <a href="#">Новости</a>
        </nav>
        <div class="tm-header-actions">
          <button type="button" class="tm-btn tm-btn-primary">Подключить</button>
        </div>
      </header>

      <main class="tm-main" style="padding: 18px 28px 22px">
        <div class="tm-sb-root">
          <div class="tm-sb-search">
            <input type="text" readonly value="Поиск узла, кабеля или координат…" aria-label="Поиск" />
          </div>

          <div class="tm-sb-row">
            <aside class="tm-panel" style="padding: 14px; overflow: auto">
              <div class="tm-section-label" style="margin-bottom: 12px">Категории элементов</div>
              <button type="button" class="tm-cat-btn tm-cat-active">Оборудование</button>
              <button type="button" class="tm-cat-btn">Офлайн-инфраструктура</button>
              <button type="button" class="tm-cat-btn">Кабели</button>
              <button type="button" class="tm-cat-btn">Узлы</button>
              <p class="tm-muted" style="margin: 14px 0 0; font-size: 12px; line-height: 1.5">
                Лабораторный режим: размещение элементов на карте/глобусе и сохранение как предложение сети.
              </p>
            </aside>

            <section class="tm-work" aria-label="Рабочая область">
              <div class="tm-chip-row">
                <span class="tm-chip"><strong>Режим</strong> моделирования</span>
                <span class="tm-chip"><strong>Слой</strong> связи</span>
                <span class="tm-chip"><strong>Проверка</strong> топологии</span>
              </div>
              <div
                style="
                  position: absolute;
                  inset: 48px 14px 14px;
                  border-radius: 4px;
                  border: 1px dashed rgba(62, 68, 74, 0.85);
                  background:
                    radial-gradient(ellipse 65% 55% at 50% 48%, rgba(244, 182, 66, 0.05), transparent 60%),
                    linear-gradient(rgba(62, 68, 74, 0.28) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(62, 68, 74, 0.28) 1px, transparent 1px);
                  background-size: auto auto, 24px 24px, 24px 24px;
                "
              >
                <div
                  style="
                    position: absolute;
                    left: 50%;
                    top: 50%;
                    width: 300px;
                    height: 300px;
                    margin: -150px 0 0 -150px;
                    border-radius: 50%;
                    border: 1px solid var(--border);
                    background: radial-gradient(circle at 35% 30%, rgba(230, 237, 243, 0.1), transparent 45%), #1a1f24;
                  "
                ></div>
                <div
                  style="
                    position: absolute;
                    left: 18%;
                    top: 38%;
                    width: 10px;
                    height: 10px;
                    border-radius: 50%;
                    background: var(--accent);
                    box-shadow: 0 0 0 4px rgba(244, 182, 66, 0.15);
                  "
                ></div>
                <div
                  style="
                    position: absolute;
                    right: 22%;
                    top: 44%;
                    width: 10px;
                    height: 10px;
                    border-radius: 50%;
                    background: var(--success);
                  "
                ></div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
